[extend]
useDefault = true

[[allowlists]]
targetRules = ["private-key", "generic-api-key"]
description = "Reviewed synthetic detector regression; exact source match and path"
condition = "AND"
regexTarget = "match"
paths = ["(^|/)packages/arvctl/tests/test_cockpit_capture\\.py$"]
regexes = ["^-----BEGIN PRIVATE KEY-----\\\\n'\\)\n        self\\.owner\\.close\\(\\)\n        self\\.owner = self\\.connect\\(\\)\n        resumed = cockpit_archive\\.WorkCapture\\(self\\.owner, self\\.sid, 'storage-after'\\)\n        resumed\\.feed\\(b'c3ludGhldGljLWJvZHk=\\\\n-----END PRIVATE KEY-----$"]

