# OpenHands MCP config shape (config.toml).
# Replace /path/to/arvyx with your checkout path.
[mcp]
stdio_servers = [
  { name = "arvyx-memory", command = "python3", args = [
    "-m",
    "arvyx_control.cli",
    "mcp",
    "--profile",
    "read-only",
    "--vault",
    "/path/to/arvyx/fixtures/synthetic-vault",
  ], env = { PYTHONPATH = "/path/to/arvyx/packages/arvctl/src" } },
]
