name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-tests:
    # Opt-in because hosted-runner minutes cost money. Linux is the supported
    # platform; the release workflow requires these three jobs on the tagged commit.
    if: vars.HOSTED_ACTIONS_ENABLED == 'true'
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and developer tools from hashed lock
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock -r requirements/secret-edge.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Provide a trusted private temporary directory
        # Native artifact policy refuses group/world-writable ancestors (e.g. /tmp);
        # the tests place synthetic native bytes under TMPDIR, so give them a private
        # directory the product's own policy accepts (same step as the correctness job).
        shell: bash
        run: |
          set -Eeuo pipefail
          for base in "$RUNNER_TEMP" "$HOME"; do
            dir="$base/arvyx-private-tmp"
            mkdir -p "$dir" && chmod 700 "$dir"
            if python -c 'import os, sys; from arvyx_control.native_artifact_policy import open_native_directory; os.close(open_native_directory(sys.argv[1]))' "$dir"; then
              echo "TMPDIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no private temporary directory accepted by the native policy on this runner"
          exit 1
      - name: Run unit tests
        timeout-minutes: 30
        run: python -m pytest packages/arvctl/tests tests -q -n 4 --dist loadfile

      - name: Build and smoke installed wheel and sdist outside checkout
        run: python scripts/package_install_smoke.py --json

      - name: Validate public secret shapes
        run: python scripts/private_context_scan.py --shapes-only

      - name: Validate tracked-path release boundary
        run: python scripts/public_release_boundary.py

      - name: Validate Docker and MCP compatibility files
        run: |
          python scripts/docker_compose_check.py --json
          python scripts/mcp_streaming_compat_check.py --json


  # Windows is a supported platform (docs/limitations.md, Platform support): the
  # suite runs on main pushes and pull requests targeting main only when
  # HOSTED_ACTIONS_ENABLED is true (also applies to manual dispatch); the release
  # workflow requires these jobs on the tagged commit. POSIX-only lanes (PTY owner,
  # host executors, secret delivery, the deployment kit) skip with their reason.
  windows-tests:
    if: vars.HOSTED_ACTIONS_ENABLED == 'true'
    name: windows-latest / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and developer tools from hashed lock
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock -r requirements/secret-edge.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Provide a trusted private temporary directory
        # The product's privacy rule on Windows is the NTFS DACL (owner, SYSTEM,
        # Administrators). The runner's TEMP may carry wider inherited entries, so
        # the tests get a directory the product itself made private, fail-closed.
        shell: bash
        run: |
          set -Eeuo pipefail
          dir="${RUNNER_TEMP}/arvyx-private-tmp"
          python - "$dir" <<'PY'
          import os, sys
          from arvyx_control.windows_acl import make_private, private_path_problem
          path = sys.argv[1]
          os.makedirs(path, exist_ok=True)
          make_private(path)
          problem = private_path_problem(path)
          if problem:
              raise SystemExit(f"::error::private temporary directory not accepted: {problem}")
          PY
          win="$(cygpath -w "$dir")"
          printf 'TEMP=%s\nTMP=%s\n' "$win" "$win" >> "$GITHUB_ENV"

      - name: Set up supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontends/paperclip/package-lock.json

      - name: Cache pinned frontend inputs for the offline npm smoke
        working-directory: frontends/paperclip
        shell: bash
        # scripts/build_arvyx_npm.py runs npm with every NPM_CONFIG_* variable removed
        # and the user npmrc disabled, so it resolves npm's default cache location,
        # not the runner image's C:\npm\cache; warm the cache the offline build reads
        # by resolving it under the same npm environment.
        run: |
          for name in $(env | sed -n 's/^\([Nn][Pp][Mm]_[Cc][Oo][Nn][Ff][Ii][Gg]_[^=]*\)=.*/\1/p'); do unset "$name"; done
          export npm_config_userconfig=nul
          cache_dir="$(npm config get cache)"
          echo "npm cache for the offline build: $cache_dir"
          npm ci --include=dev --ignore-scripts --no-audit --no-fund --cache "$cache_dir"

      - name: Build, install and smoke the Windows npm package
        timeout-minutes: 10
        run: python scripts/npm_package_smoke.py --json

      - name: Run unit tests
        run: python -m pytest packages/arvctl/tests tests -q -n 4 --dist loadfile

      - name: Build and smoke installed wheel and sdist outside checkout
        run: python scripts/package_install_smoke.py --json

      - name: Validate public secret shapes
        run: python scripts/private_context_scan.py --shapes-only

      - name: Validate tracked-path release boundary
        run: python scripts/public_release_boundary.py

  # macOS has no acceptance receipts yet (docs/limitations.md, Platform support).
  # It runs only when the owner opts in and is not required by the release
  # workflow; failures are reported, never masked.
  experimental-platform-tests:
    if: vars.HOSTED_ACTIONS_ENABLED == 'true' && vars.HOSTED_EXPERIMENTAL_PLATFORMS == 'true'
    name: experimental ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and developer tools from hashed lock
        run: |
          python -m pip install --require-hashes -r requirements/dev.lock -r requirements/secret-edge.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Provide a trusted private temporary directory
        # Native artifact policy refuses group/world-writable ancestors (e.g. /tmp);
        # the tests place synthetic native bytes under TMPDIR, so give them a private
        # directory the product's own policy accepts (same step as the correctness job).
        shell: bash
        run: |
          set -Eeuo pipefail
          for base in "$RUNNER_TEMP" "$HOME"; do
            dir="$base/arvyx-private-tmp"
            mkdir -p "$dir" && chmod 700 "$dir"
            if python -c 'import os, sys; from arvyx_control.native_artifact_policy import open_native_directory; os.close(open_native_directory(sys.argv[1]))' "$dir"; then
              echo "TMPDIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no private temporary directory accepted by the native policy on this runner"
          exit 1
      - name: Run unit tests
        timeout-minutes: 30
        run: python -m pytest packages/arvctl/tests tests -q -n 4 --dist loadfile

      - name: Build and smoke installed wheel and sdist outside checkout
        run: python scripts/package_install_smoke.py --json

      - name: Validate public secret shapes
        run: python scripts/private_context_scan.py --shapes-only

      - name: Validate tracked-path release boundary
        run: python scripts/public_release_boundary.py

      - name: Validate Docker and MCP compatibility files
        run: |
          python scripts/docker_compose_check.py --json
          python scripts/mcp_streaming_compat_check.py --json

  # Required aggregate: green only when security, every correctness shard and
  # integration succeeded, and only if the shards' combined branch coverage clears
  # the floor.
  test:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [security, correctness, integration]
    steps:
      - name: Require security, correctness and integration
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          CORRECTNESS_RESULT: ${{ needs.correctness.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$SECURITY_RESULT" = success && test "$CORRECTNESS_RESULT" = success && test "$INTEGRATION_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install coverage from its hashed lock
        run: python -m pip install --require-hashes -r requirements/coverage.lock

      - name: Download the shards' coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards

      - name: Enforce branch coverage floor over the whole suite
        # The shards each measured part of the suite; only their union is the
        # suite's coverage, so the floor is enforced here and nowhere else.
        env:
          COVERAGE_FILE: ${{ runner.temp }}/arvyx.coverage
        run: |
          set -Eeuo pipefail
          shards="$(find "${RUNNER_TEMP}/coverage-shards" -type f -name arvyx.coverage | sort)"
          test "$(printf '%s\n' "$shards" | grep -c .)" -eq 2
          # shellcheck disable=SC2086
          coverage combine --keep $shards
          coverage report --fail-under=75

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Materialize the private-name denylist
        # The maintainers' denylist is a secret (base64, one term per line). Pull
        # requests from forks cannot read it and scan with the synthetic example
        # list; every other context without the secret fails instead of scanning
        # with a weaker list. This job runs no third-party build steps.
        env:
          ARVEN_PRIVATE_DENYLIST_B64: ${{ secrets.ARVEN_PRIVATE_DENYLIST_B64 }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          target="${RUNNER_TEMP}/private-denylist.txt"
          if test -n "$ARVEN_PRIVATE_DENYLIST_B64"; then
            printf '%s' "$ARVEN_PRIVATE_DENYLIST_B64" | base64 -d > "$target"
          elif test "$GITHUB_EVENT_NAME" = pull_request && { test "$ACTOR" = "dependabot[bot]" || { test -n "$PR_HEAD_REPO" && test "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY"; }; }; then
            echo "::notice::fork or Dependabot pull request: the private denylist secret is unavailable; scanning with fixtures/private-denylist.example.txt"
            cp fixtures/private-denylist.example.txt "$target"
          else
            echo "::error::ARVEN_PRIVATE_DENYLIST_B64 is not configured for this repository; the strict private-context scan cannot run"
            exit 1
          fi
          test -s "$target"
          chmod 600 "$target"
          echo "ARVYX_PRIVATE_DENYLIST=$target" >> "$GITHUB_ENV"
      - name: Require strict private-context assurance
        run: python scripts/private_context_scan.py
      - name: Validate tracked-path release boundary
        if: ${{ !cancelled() }}
        run: python scripts/public_release_boundary.py
      - name: Install pinned Gitleaks with repository-pinned digest
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "${RUNNER_TEMP}/gitleaks"
      - name: Scan exact tracked tree with Gitleaks
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          tree="$(mktemp -d)"
          trap 'rm -rf "$tree"' EXIT
          git archive HEAD | tar -xf - -C "$tree"
          "${RUNNER_TEMP}/gitleaks" dir "$tree" --no-banner --redact=100

  # No dependency on security: failures there must not hide correctness evidence.
  correctness:
    # Dependency hygiene, the MCP evidence client, the preflight contracts and the
    # Python suite with branch coverage, split into two shards of test files
    # (scripts/ci_test_shard.py, deterministic) so the coverage-instrumented run
    # fits the runner budget. Each shard uploads its coverage data; the `test`
    # aggregate combines the shards and enforces the floor over the whole suite.
    # Frontend, npm, integration gates and the Docker smoke run in `integration`.
    name: correctness (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Use the synthetic example denylist for correctness checks
        # The real denylist is a secret and is used only by the security job, which
        # runs no third-party build steps. This job installs pinned npm and pip
        # packages, so it runs the same scanner mechanics with the synthetic list.
        run: |
          set -Eeuo pipefail
          target="${RUNNER_TEMP}/private-denylist.txt"
          cp fixtures/private-denylist.example.txt "$target"
          chmod 600 "$target"
          echo "ARVYX_PRIVATE_DENYLIST=$target" >> "$GITHUB_ENV"

      - name: Set up supported Node
        # Python tests that shell out to node (the npm launcher) must see the pinned
        # Node, not whatever the runner image ships.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"

      - name: Audit dependencies and generate source CycloneDX SBOM
        env:
          SBOM_PATH: ${{ runner.temp }}/source-sbom.cdx.json
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r requirements/dev.lock -r requirements/secret-edge.lock
          python -m pip install --no-deps --no-build-isolation -e .
          make dependency-audit PYTHON=python
          make sbom PYTHON=python SBOM_PATH="$SBOM_PATH"
          make license-check PYTHON=python

      - name: Exercise the MCP evidence client against its pinned lock
        # The producer only ever ran at tag time, so SDK or server drift would have
        # been discovered by a failed release instead of a failed push. This runs it
        # unsigned on main pushes / PRs targeting main (this correctness job is not
        # controlled by HOSTED_ACTIONS_ENABLED) and proves unsigned release refusal.
        run: |
          set -Eeuo pipefail
          client_venv="${RUNNER_TEMP}/mcp-evidence-client"
          python -m venv "$client_venv"
          "$client_venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            --require-hashes -r requirements/mcp-client.lock
          evidence="${RUNNER_TEMP}/evidence.mcp-client.json"
          capture="${RUNNER_TEMP}/evidence.mcp-client.capture.json"
          "$client_venv/bin/python" scripts/mcp_client_real_evidence.py \
            --output "$evidence" --capture-out "$capture"
          "$client_venv/bin/python" scripts/mcp_client_real_evidence.py --check "$evidence"
          # The recorded measurement must replay from the kept capture, and a tampered
          # capture must fail the replay.
          "$client_venv/bin/python" scripts/mcp_client_real_evidence.py \
            --check "$evidence" --verify-capture "$capture"
          printf 'tampered' >> "$capture"
          tamper_rc=0
          tamper_out="$("$client_venv/bin/python" scripts/mcp_client_real_evidence.py \
            --check "$evidence" --verify-capture "$capture" 2>&1)" || tamper_rc=$?
          test "$tamper_rc" -ne 0
          printf '%s\n' "$tamper_out" | grep -q "does not hash to the digest recorded"
          echo "altered capture refused by the replay"
          release_rc=0
          release_out="$("$client_venv/bin/python" scripts/mcp_client_real_evidence.py \
            --check "$evidence" --release 2>&1)" || release_rc=$?
          printf '%s\n' "$release_out"
          test "$release_rc" -ne 0
          # The refusal has to be the documented one, not any crash on the way there.
          printf '%s\n' "$release_out" | grep -q "attestation is required in release mode"
          echo "unsigned evidence refused in release mode with the documented reason"

      - name: Retain source SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-sbom-cyclonedx
          path: ${{ runner.temp }}/source-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Run cheap contracts and MCP smoke before the full suite
        run: make ci-preflight PYTHON=python

      - name: Provide a trusted private temporary directory
        # Native artifact policy refuses group/world-writable ancestors (e.g. /tmp).
        # Tests and the npm smoke place synthetic native bytes under TMPDIR, so give
        # them a private directory whose ancestry the product's own policy accepts.
        run: |
          set -Eeuo pipefail
          for base in "$RUNNER_TEMP" "$HOME"; do
            dir="$base/arvyx-private-tmp"
            mkdir -p "$dir" && chmod 700 "$dir"
            if python -c 'import os, sys; from arvyx_control.native_artifact_policy import open_native_directory; os.close(open_native_directory(sys.argv[1]))' "$dir"; then
              echo "TMPDIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no temporary directory satisfies the native artifact ancestor policy" >&2
          exit 1

      - name: Run Python correctness tests independently of release policy
        # The suite is 5,200+ tests; the self-dogfood and release-evidence tests in
        # test_recall alone take about ten minutes on a hosted runner.
        timeout-minutes: 30
        env:
          COVERAGE_FILE: ${{ runner.temp }}/arvyx.coverage
        run: |
          set -Eeuo pipefail
          targets="$(python scripts/ci_test_shard.py --count 2 --index ${{ matrix.shard }})"
          make test-python PYTHON=python PYTEST_TARGETS="$targets" \
            PYTEST_ARGS="--durations=30 --junitxml=${{ runner.temp }}/python-test-timings.xml"

      - name: Retain Python test timings even after test failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-test-timings.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Retain this shard's coverage data for the aggregate floor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/arvyx.coverage
          if-no-files-found: error
          retention-days: 7

  integration:
    # Frontend and npm tests, the local npm package smoke, the parallel integration
    # gates and the Docker runtime smoke, in parallel with the Python suite.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.lock
      - name: Use the synthetic example denylist for correctness checks
        # The real denylist is a secret and is used only by the security job, which
        # runs no third-party build steps. This job installs pinned npm and pip
        # packages, so it runs the same scanner mechanics with the synthetic list.
        run: |
          set -Eeuo pipefail
          target="${RUNNER_TEMP}/private-denylist.txt"
          cp fixtures/private-denylist.example.txt "$target"
          chmod 600 "$target"
          echo "ARVYX_PRIVATE_DENYLIST=$target" >> "$GITHUB_ENV"

      - name: Install package and developer tools from hashed lock
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r requirements/dev.lock -r requirements/secret-edge.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Set up supported Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontends/paperclip/package-lock.json

      - name: Prepare pinned frontend dependencies (requires Node >=24.11)
        run: make frontend-deps

      - name: Provide a trusted private temporary directory
        # Native artifact policy refuses group/world-writable ancestors (e.g. /tmp).
        # Tests and the npm smoke place synthetic native bytes under TMPDIR, so give
        # them a private directory whose ancestry the product's own policy accepts.
        run: |
          set -Eeuo pipefail
          for base in "$RUNNER_TEMP" "$HOME"; do
            dir="$base/arvyx-private-tmp"
            mkdir -p "$dir" && chmod 700 "$dir"
            if python -c 'import os, sys; from arvyx_control.native_artifact_policy import open_native_directory; os.close(open_native_directory(sys.argv[1]))' "$dir"; then
              echo "TMPDIR=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no temporary directory satisfies the native artifact ancestor policy" >&2
          exit 1

      - name: Run frontend correctness tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: make test-frontend

      - name: Run npm package correctness tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: make test-npm

      - name: Build, install and smoke the local npm package
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: make npm-package-smoke PYTHON=python

      - name: Run remaining complete local integration gates
        run: make ci-integration PYTHON=python

      - name: Run Docker runtime smoke
        run: |
          set -Eeuo pipefail
          python scripts/docker_runtime_smoke.py --json | tee /tmp/docker-runtime-smoke.json
          python -c 'import json; from pathlib import Path; data=json.loads(Path("/tmp/docker-runtime-smoke.json").read_text(encoding="utf-8")); assert data.get("ok") is True, data'
